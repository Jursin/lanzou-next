[package]
name = "lanzou-next"
version = "1.0.4"
description = "蓝奏云客户端"
authors = ["lanzou-next"]
edition = "2024"

[lib]
name = "lanzou_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
thiserror = "2"
log = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "cookies", "gzip"] }
futures-util = "0.3"
regex = "1"
dirs = "6"
chrono = "0.4"
sanitize-filename = "0.6"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true
opt-level = "s"

[lints.clippy]
unwrap_used = "deny"
redundant_closure_for_method_calls = "warn"

[lints.rust]
linker_messages = "allow"
