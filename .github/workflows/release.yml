name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: ""
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm tauri build --bundles nsis --target ${{ matrix.rust_target }}
          else
            pnpm tauri build --bundles nsis
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: Windows-${{ matrix.arch }}
          path: src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-22.04-arm
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles appimage deb rpm
      - uses: actions/upload-artifact@v7
        with:
          name: Linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Arch Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Install system deps
        run: |
          for i in $(seq 1 10); do
            pacman -Syu --noconfirm base-devel rust nodejs npm git \
              gtk3 webkit2gtk-4.1 libappindicator-gtk3 librsvg pkgconf && break
            echo "pacman sync failed (attempt $i/10), retrying in 30s..."
            sleep 30
          done
          pacman -Qi gtk3 >/dev/null || { echo "Failed to install system packages"; exit 1; }
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
      - uses: actions/checkout@v7
        with:
          path: _src
      - name: Setup pnpm
        run: npm install -g pnpm@11
      - name: Install and build
        run: |
          chown -R builder:builder _src
          cd _src
          su builder -c "HOME=/home/builder pnpm install --frozen-lockfile"
          su builder -c "HOME=/home/builder pnpm tauri build --no-bundle"

      - name: Package .pkg.tar.zst
        shell: bash
        run: |
          ver="$(node -p "require('./_src/package.json').version")"
          pkgdir=$(mktemp -d)

          mkdir -p "$pkgdir"/{usr/bin,usr/share/applications}
          mkdir -p "$pkgdir"/usr/share/icons/hicolor/{32x32,128x128,256x256,512x512}/apps
          mkdir -p "$pkgdir"/usr/share/licenses/lanzou-next

          cp _src/src-tauri/target/release/lanzou-next "$pkgdir/usr/bin/"
          cp _src/src-tauri/icons/32x32.png       "$pkgdir/usr/share/icons/hicolor/32x32/apps/lanzou-next.png"
          cp _src/src-tauri/icons/128x128.png     "$pkgdir/usr/share/icons/hicolor/128x128/apps/lanzou-next.png"
          cp _src/src-tauri/icons/128x128@2x.png  "$pkgdir/usr/share/icons/hicolor/256x256/apps/lanzou-next.png"
          cp _src/src-tauri/icons/512x512.png     "$pkgdir/usr/share/icons/hicolor/512x512/apps/lanzou-next.png"
          cp _src/LICENSE                         "$pkgdir/usr/share/licenses/lanzou-next/"

          cat > "$pkgdir/usr/share/applications/lanzou-next.desktop" <<'EOF'
          [Desktop Entry]
          Name=蓝奏云盘
          Comment=蓝奏云客户端
          Exec=/usr/bin/lanzou-next
          Icon=lanzou-next
          Type=Application
          Categories=Utility;FileTransfer;
          Terminal=false
          EOF

          builddate=$(date +%s)
          size=$(du -sb "$pkgdir" | awk '{print $1}')

          cat > "$pkgdir/.PKGINFO" <<EOF
          pkgname = lanzou-next
          pkgbase = lanzou-next
          pkgver = $ver-1
          pkgdesc = 蓝奏云客户端
          url = https://github.com/${{ github.repository }}
          builddate = $builddate
          packager = GitHub Actions
          size = $size
          arch = x86_64
          license = MIT
          depends = webkit2gtk-4.1
          depends = gtk3
          depends = libappindicator
          depends = librsvg
          EOF

          cd "$pkgdir"
          bsdtar --format=bsdtar -cf "$GITHUB_WORKSPACE/lanzou-next-$ver-1-x86_64.pkg.tar" \
            --uid=0 --gid=0 --uname=root --gname=root \
            .PKGINFO usr
          zstd -19 -f -q "$GITHUB_WORKSPACE/lanzou-next-$ver-1-x86_64.pkg.tar" \
            -o "$GITHUB_WORKSPACE/lanzou-next-$ver-1-x86_64.pkg.tar.zst"
          rm "$GITHUB_WORKSPACE/lanzou-next-$ver-1-x86_64.pkg.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: Arch-x64
          path: "*.pkg.tar.zst"
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-14
          - arch: x64
            os: macos-14
            rust_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            pnpm tauri build --bundles dmg --target ${{ matrix.rust_target }}
          else
            pnpm tauri build --bundles dmg
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: macOS-${{ matrix.arch }}
          path: src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, arch, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: List all artifacts
        run: find artifacts -type f | sort
      - name: Extract changelog
        id: changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          body=$(awk -v ver="$tag" '
            /^## [0-9]/ {
              if (found) exit
              if (index($0, "## " ver)) found=1
              next
            }
            found && NF { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            body="详见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          fi
          # 追加下载链接模板
          version="${GITHUB_REF_NAME#v}"
          prev_version=$(grep -m2 '^## [0-9]' CHANGELOG.md | tail -1 | sed 's/^## //')
          template=$(sed -e "s|VERSION|${version}|g" -e "s|PREV_VERSION|${prev_version}|g" .github/release_template.md)
          body="${body}"$'\n\n'"${template}"
          {
            echo "BODY<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Detect pre-release
        id: prerelease
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -qE '-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: ${{ steps.changelog.outputs.BODY }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          overwrite_files: true
          fail_on_unmatched_files: false
